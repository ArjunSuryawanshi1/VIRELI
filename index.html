<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIRELI | AI Student Planner</title>
    <meta
      name="description"
      content="VIRELI is an AI student planner that helps students decide what to work on and when to do it."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      window.tailwind = {
        config: {
          theme: {
            extend: {
              fontFamily: {
                display: ["Sora", "sans-serif"],
                body: ["Manrope", "sans-serif"],
              },
              colors: {
                vireli: {
                  deep: "#80121c",
                  red: "#d81f36",
                  blush: "#ffe2e4",
                  rose: "#ff9fa7",
                  snow: "#fffafa",
                },
              },
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#bc1c2c" />
    <link rel="icon" href="./icons/vireli-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=day20-sidebar-simplification-20260904" />
  </head>
  <body>
    <div id="root"></div>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"
    ></script>
    <script src="./script.js?v=day20-sidebar-simplification-20260904"></script>
    <script>
      if ("serviceWorker" in navigator && /^https?:$/.test(window.location.protocol)) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./service-worker.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
